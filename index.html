<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lepus Clicker</title>
  <link rel="icon" href="assets/sprites/suspicious_egg.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lepus Clicker">
  <meta name="theme-color" content="#26327a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud" class="panel">
      <div class="stat main"><img id="hudIcon" alt=""><span><b id="bal">0</b> Lepus</span></div>
      <div class="stat"><span class="label">per second</span><b id="lps">0.0</b></div>
      <div class="stat"><span class="label">per click</span><b id="clickVal">1</b></div>
      <div class="buttons">
        <button id="musicBtn" class="tool" aria-pressed="true" title="Music">♫</button>
        <button id="sfxBtn" class="tool" aria-pressed="true" title="Sound effects">🔊</button>
        <button id="menuBtn" class="tool" title="Menu">⚙</button>
      </div>
    </header>

    <main id="play">
      <canvas id="cv"></canvas>
      <button id="spin" aria-label="Click the Lepus"></button>
      <div id="legend" class="panel"></div>
      <div id="hint">Click the Lepus!</div>
      <nav id="modeTabs">
        <button data-mode="yard" aria-pressed="true">🥚 Clicker</button>
        <button data-mode="pen" aria-pressed="false">🐰 Pen<span id="penDot"></span></button>
      </nav>
      <div id="penBar" class="panel" hidden>
        <div class="happy" title="Happy Lepuses earn more. Pet them, feed them and play with them!">
          <span class="h">♥</span><div class="meter"><i id="happyFill"></i></div><span id="happyText"></span>
        </div>
        <div class="pen-buttons">
          <button id="feedBtn">🥕 Feed</button>
          <button id="eggBtn">🥚 Toss egg</button>
        </div>
      </div>
    </main>

    <aside id="shop" class="panel">
      <button id="shopToggle"><span>Shop</span><span id="shopBadge"></span><span class="chev">▲</span></button>
      <h2>Shop</h2>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="buildings" aria-selected="true">Buildings</button>
        <button class="tab" role="tab" data-tab="upgrades" aria-selected="false">Upgrades <span id="upBadge" class="badge"></span></button>
      </div>
      <div id="buyAmount">
        <span>Buy</span>
        <button data-n="1" aria-pressed="true">×1</button>
        <button data-n="10" aria-pressed="false">×10</button>
        <button data-n="100" aria-pressed="false">×100</button>
      </div>
      <div id="shopList" class="list"></div>
      <div id="upgradeList" class="list" hidden></div>
    </aside>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="menu" class="panel">
    <h2>Lepus Clicker</h2>
    <p id="stats"></p>
    <div class="menu-buttons">
      <button id="saveBtn">Save now</button>
      <button id="resetBtn" class="danger">Reset progress</button>
      <button id="closeBtn">Close</button>
    </div>
    <p class="credits">Lepus sprites &amp; boss theme from the Consolaria mod. Sound effects from Terraria (Re-Logic). Personal use only.</p>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
